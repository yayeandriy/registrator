name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua-tests:
    name: Pure-Lua test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run tests/run_all.lua
        run: lua5.4 tests/run_all.lua
